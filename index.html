<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-profile="pessoal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acefer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Acefer Economy</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50%' y='68%' font-size='60' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>∧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#09090b;--s1:#131317;--s2:#1c1c22;--bd:#26262e;--bd2:#3a3a44;--tx:#f4f4f5;--tx2:#a1a1aa;--tx3:#71717a;--ac:#6366f1;--acf:#fff;--in:#10b981;--out:#f43f5e;--sv:#8b5cf6;--warn:#f59e0b;--r:18px;--nav:66px}
[data-theme=light]{--bg:#f5f6fa;--s1:#fff;--s2:#f0f2f7;--bd:#e3e6ee;--bd2:#cdd2dc;--tx:#0f172a;--tx2:#475569;--tx3:#8a94a6}
[data-theme=emerald]{--bg:#03211b;--s1:#062e26;--s2:#0a3b31;--bd:#0f4d40;--bd2:#166554;--tx:#ecfdf5;--tx2:#a7f3d0;--tx3:#6ee7b7;--ac:#10b981;--acf:#03211b}
[data-profile=danfer]{--ac:#3b82f6;--acf:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--tx2);font-size:13px;line-height:1.5;margin-bottom:12px}
.warn{color:var(--warn)}
h2.pt{font-size:22px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px;line-height:1.3}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate.off{display:none}
.gate-card{width:100%;max-width:380px}
.gate h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.gate-spin{display:none;text-align:center;font-size:30px;color:var(--ac);margin-top:10px}
.gate.loading .gate-spin{display:block}.gate.loading .gate-form{display:none}
.pw{position:relative}.pw .inp{padding-right:46px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--tx3);font-size:18px}
.app{min-height:100dvh}
.sidebar{display:none}
main{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px);min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.prof{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;min-width:0}
.prof .brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
.tb-r{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);font-size:13px;font-weight:700}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--bd);font-size:18px;flex-shrink:0}
.spin{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
.page{display:none;padding:16px;max-width:1120px;margin:0 auto;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--tx3)}
.bn i{font-size:23px}.bn.on{color:var(--ac)}
.bn-add{display:grid;place-items:center}
.bn-add span{width:54px;height:54px;border-radius:18px;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-size:26px;margin-top:-18px;box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 45%,transparent)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.link{color:var(--ac);font-weight:700;font-size:13px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.mb-l{font-weight:800;font-size:16px;padding:8px 10px;border-radius:12px;text-align:center}
.mb-l small{display:block;color:var(--ac);font-weight:700;font-size:11px}
.hero .lbl{color:var(--tx2);font-size:13px;font-weight:700}
.big{font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-1px;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--out)}
.sub{color:var(--tx3);font-size:12px}
.fc{margin-top:8px;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.mini{background:var(--s2);border-radius:14px;padding:10px;text-align:left;min-width:0}
.mini .k{font-size:10.5px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.4px;display:flex;gap:4px;align-items:center}
.mini .v{font-weight:700;font-size:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .d{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border-color:color-mix(in srgb,var(--warn) 45%,var(--bd));background:color-mix(in srgb,var(--warn) 9%,var(--s1))}
.alert i{font-size:24px;color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;text-align:left;border-radius:14px}
.tx:hover{background:var(--s2)}
.tx-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c);font-size:19px}
.tx-ic.lg{width:54px;height:54px;font-size:25px;border-radius:17px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-desc{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--tx3);display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;margin-top:2px}
.tx-val{font-weight:700;font-size:14px;white-space:nowrap}
.tx-val.in{color:var(--in)}.tx-val.save,.tx-val.withdraw{color:var(--sv)}
.tx.pend .tx-val{opacity:.6}
.badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--s2);color:var(--tx2)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag{font-size:11.5px;color:var(--ac);font-weight:700}
.day{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;padding:14px 6px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:99px;border:1px solid var(--bd2);font-size:13px;font-weight:700;color:var(--tx2);background:var(--s1)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
select.chip,.mini-sel{font-size:16px}
.inp{width:100%;padding:12px 14px;background:var(--s2);border:1px solid var(--bd2);border-radius:12px;outline:none}
.inp:focus{border-color:var(--ac)}
textarea.inp{resize:vertical}
.search{position:relative;margin-bottom:10px}.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3)}.search .inp{padding-left:40px}
.seg{display:flex;background:var(--s2);border-radius:13px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--tx2)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:700;font-size:14px;background:var(--s2);border:1px solid var(--bd2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 50%,var(--bd2))}
.btn.block{width:100%}
.valbox{display:flex;align-items:baseline;gap:8px;padding:6px 2px 12px;border-bottom:2px solid var(--bd2);margin-bottom:14px}
.valbox:focus-within{border-color:var(--ac)}
.valbox span{font-size:22px;color:var(--tx3);font-weight:800}
.valbox input{background:none;border:0;outline:none;font-size:38px;font-weight:700;width:100%;font-family:'JetBrains Mono',monospace}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:13px;border:1px solid var(--bd);font-size:11.5px;font-weight:700;color:var(--tx2);text-align:center;line-height:1.2}
.cat i{font-size:21px;color:var(--c)}
.cat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--tx)}
.lbl2{font-size:11.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;margin:4px 0 8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--tx3);margin-bottom:10px}
.quick{display:flex;gap:6px}.quick button{flex:1;border:1px solid var(--bd2);border-radius:12px;font-weight:700;font-size:13px}
details{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:4px 0 14px}
summary{font-weight:700;font-size:14px;cursor:pointer;color:var(--tx2)}
details[open] summary{margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx2);margin-bottom:10px}
.chk input{width:18px;height:18px;accent-color:var(--ac);flex-shrink:0}
.kv{border:1px solid var(--bd);border-radius:14px;margin:14px 0}
.kv-r{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--bd);font-size:14px}.kv-r:last-child{border:0}
.kv-r span{color:var(--tx3);flex-shrink:0}.kv-r b{font-weight:600;text-align:right;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .full{grid-column:1/-1}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ac));transition:width .3s}
.rank{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left;border-bottom:1px solid var(--bd)}.rank:last-child{border:0}
.delta{font-size:11px;font-weight:700}.delta.up{color:var(--out)}.delta.down{color:var(--in)}
.chartbox{height:240px;position:relative}
.empty{text-align:center;color:var(--tx3);padding:28px 12px;font-size:14px}
.empty i{font-size:42px;display:block;margin-bottom:8px;color:var(--bd2)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px;border:2px dashed var(--bd2);border-radius:16px;background:var(--s2);cursor:pointer;margin-bottom:10px;text-align:center}
.drop i{font-size:36px;color:var(--ac)}.drop span{font-size:12px;color:var(--tx3)}
.drop.over{border-color:var(--ac)}
.imp-r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.imp-r.off{opacity:.45}.imp-r input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex-shrink:0}
.mini-sel{margin-top:6px;padding:6px 8px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;max-width:100%}
.menu-l{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--bd);font-weight:600;text-align:left}
.menu-l:last-child{border:0}.menu-l i:first-child{font-size:20px;color:var(--ac)}.menu-l .ph-caret-right{margin-left:auto;color:var(--tx3)}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet-wrap.on{display:flex}
.sheet{background:var(--s1);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd2);margin:6px auto 14px}
.sheet-t{font-size:18px;font-weight:800;margin-bottom:14px}
.det-head{display:flex;gap:14px;align-items:center}
.det-val{font-size:26px;font-weight:700}.det-desc{color:var(--tx2);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;z-index:70;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:16px;align-items:center;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--ac);font-weight:800}
kbd{font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2)}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;padding:18px 12px;background:var(--s1);border-right:1px solid var(--bd)}
  .sidebar .btn{margin-bottom:12px}
  .nav-i{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--tx2);text-align:left}
  .nav-i i{font-size:20px}.nav-i:hover{background:var(--s2);color:var(--tx)}.nav-i.on{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
  .bottomnav,.mob-only{display:none!important}
  main{padding-bottom:30px}.page{padding:24px}
  .cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
  .sheet-wrap{align-items:center}.sheet{border-radius:22px;padding:22px}.grab{display:none}
  #toast{bottom:24px}
  .chartbox{height:280px}
}
</style>
</head>
<body>
<div class="gate loading" id="gate">
  <form class="gate-card" onsubmit="doLogin(event)">
    <div class="logo" style="width:58px;height:58px;font-size:30px;border-radius:17px;margin:0 auto 14px">∧</div>
    <h1>Acefer Economy</h1>
    <p class="muted" style="text-align:center">Entre para ver as finanças da família</p>
    <div class="gate-spin"><i class="ph-bold ph-circle-notch spin"></i></div>
    <div class="gate-form">
      <label class="field">E-mail<input id="gEmail" class="inp" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field">Senha<span class="pw"><input id="gPass" class="inp" type="password" autocomplete="current-password" required><button type="button" onclick="const i=$('#gPass');i.type=i.type==='password'?'text':'password'" aria-label="Mostrar senha"><i class="ph-bold ph-eye"></i></button></span></label>
      <button class="btn pri block" id="gBtn" type="submit">Entrar</button>
      <button type="button" class="link" style="display:block;margin:16px auto 0" onclick="forgot()">Esqueci a senha</button>
      <p id="gMsg" class="muted" style="text-align:center;margin-top:12px"></p>
    </div>
  </form>
</div>

<div class="app">
  <aside class="sidebar">
    <button class="btn pri block" onclick="openForm()"><i class="ph-bold ph-plus"></i> Novo lançamento <kbd>N</kbd></button>
    <button class="nav-i" data-go="home" onclick="go('home')"><i class="ph-bold ph-house"></i>Início</button>
    <button class="nav-i" data-go="list" onclick="go('list')"><i class="ph-bold ph-list-bullets"></i>Extrato</button>
    <button class="nav-i" data-go="analysis" onclick="go('analysis')"><i class="ph-bold ph-chart-pie-slice"></i>Análise</button>
    <button class="nav-i" data-go="budgets" onclick="go('budgets')"><i class="ph-bold ph-target"></i>Metas</button>
    <button class="nav-i" data-go="import" onclick="go('import')"><i class="ph-bold ph-file-arrow-down"></i>Importar</button>
    <button class="nav-i" data-go="settings" onclick="go('settings')"><i class="ph-bold ph-gear"></i>Ajustes</button>
  </aside>
  <main>
    <header class="topbar">
      <button class="prof" onclick="openProfile()"><span class="logo">∧</span><span class="brand-name">Acefer Economy</span><i class="ph-bold ph-caret-down"></i></button>
      <div class="tb-r">
        <button class="pill" id="modeBtn" onclick="setMode()"></button>
        <button class="ib" id="privBtn" onclick="togglePrivacy()" aria-label="Ocultar valores"></button>
        <button class="ib" id="syncBtn" onclick="syncNow()" aria-label="Sincronizar"><i class="ph-bold ph-cloud"></i></button>
      </div>
    </header>
    <section class="page" id="p-home"></section>
    <section class="page" id="p-list"></section>
    <section class="page" id="p-analysis"></section>
    <section class="page" id="p-budgets"></section>
    <section class="page" id="p-import"></section>
    <section class="page" id="p-settings"></section>
  </main>
</div>
<nav class="bottomnav">
  <button class="bn" data-go="home" onclick="go('home')"><i class="ph-bold ph-house"></i>Início</button>
  <button class="bn" data-go="list" onclick="go('list')"><i class="ph-bold ph-list-bullets"></i>Extrato</button>
  <button class="bn-add" onclick="openForm()" aria-label="Novo lançamento"><span><i class="ph-bold ph-plus"></i></span></button>
  <button class="bn" data-go="analysis" onclick="go('analysis')"><i class="ph-bold ph-chart-pie-slice"></i>Análise</button>
  <button class="bn" data-go="settings" onclick="go('settings')"><i class="ph-bold ph-dots-three-outline"></i>Mais</button>
</nav>
<div class="sheet-wrap" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
// ═══════════ CONFIGURAÇÃO DO SUPABASE ═══════════
// São dados PÚBLICOS por natureza. Quem protege os dados é o login + a lista de e-mails no banco.
const SUPABASE_URL='https://SEU-PROJETO.supabase.co';      // ⚠️ PREENCHA
const SUPABASE_KEY='sb_publishable_COLE_A_NOVA_CHAVE';      // ⚠️ PREENCHA (a NOVA, depois de revogar a antiga)

// ───────── util ─────────

function norm(t){const n=now();return{id:String(t.id??uid()).replace(/[^\w.-]/g,'')||uid(),type:['in','out','save','withdraw'].includes(t.type)?t.type:'out',value:r2(Math.abs(Number(t.value)||0)),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:today(),category:String(t.category||'outros').replace(/[^\w-]/g,'')||'outros',desc:String(t.desc||''),status:t.status==='pending'?'pending':'paid',account:String(t.account||''),method:String(t.method||''),tags:Array.isArray(t.tags)?t.tags.map(String):[],notes:String(t.notes||''),installment:t.installment&&+t.installment.total?{n:+t.installment.n,total:+t.installment.total}:null,groupId:t.groupId?String(t.groupId).replace(/[^\w.-]/g,''):null,recurring:!!t.recurring,by:String(t.by||''),createdAt:t.createdAt||n,updatedAt:t.updatedAt||n,deleted:!!t.deleted}}
function loadDB(userId){
  KEY='acefer_v3_'+userId;let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('acefer_v2'))}catch(e){}
  if(!d){
    d={profiles:{pessoal:[],danfer:[]},budgets:{pessoal:{},danfer:{}},bUpd:{pessoal:'',danfer:''},settings:{...DEF_SETTINGS},lastSync:null};
    [['pessoal','acefer_txs'],['danfer','danfer_txs']].forEach(([p,k])=>{try{d.profiles[p]=JSON.parse(localStorage.getItem(k))||[]}catch(e){}});
    const th=localStorage.getItem('acefer_theme');if(th==='light'||th==='emerald')d.settings.theme=th;
  }
  const {sbUrl,sbKey,...st}=d.settings||{};d.settings={...DEF_SETTINGS,...st};
  d.profiles={pessoal:(d.profiles?.pessoal||[]).map(norm),danfer:(d.profiles?.danfer||[]).map(norm)};
  d.budgets={pessoal:{},danfer:{},...(d.budgets||{})};d.bUpd={pessoal:'',danfer:'',...(d.bUpd||{})};
  // correção única: "Dinheiro retirado" é resgate do cofre, não dinheiro guardado
  if(!d.fixWd){['pessoal','danfer'].forEach(p=>d.profiles[p].forEach(t=>{if(t.type==='save'&&/dinheiro retirado|resgat/i.test(t.desc)){t.type='withdraw';t.updatedAt=now()}}));d.fixWd=1}
  return d;
}

function money(v){if(DB?.settings.privacy)return 'R$ ••••';const n=Number(v||0);return (n<0?'−':'')+Math.abs(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
const compact=v=>Math.abs(v)>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':v;
function sums(L){const s={in:0,out:0,save:0,withdraw:0,pin:0,pout:0,psave:0,pwd:0,nPend:0},pk={in:'pin',out:'pout',save:'psave',withdraw:'pwd'};
  L.forEach(t=>{if(!counts(t))return;if(t.status==='pending'){s.nPend++;s[pk[t.type]]+=t.value}else s[t.type]+=t.value});
  s.free=s.in-s.out-s.save+s.withdraw;s.forecast=s.free+s.pin-s.pout-s.psave+s.pwd;return s}
const total=(L,tp)=>L.filter(t=>t.type===tp&&counts(t)).reduce((a,t)=>a+t.value,0);
function shiftYm(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addMonths(ds,i){const [y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1+i,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return iso(new Date(dt.getFullYear(),dt.getMonth(),Math.min(d,last)))}
function fmtDay(ds){const t=today(),y=iso(new Date(Date.now()-864e5));if(ds===t)return 'Hoje';if(ds===y)return 'Ontem';return new Date(ds+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}
const fmtShort=ds=>ds.split('-').reverse().join('/');
const fmtStamp=s=>new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function parseMoney(s){s=String(s??'').replace(/R\$|\s/g,'');if(!s)return NaN;const neg=/^-|-$|^\(.*\)$/.test(s);s=s.replace(/[-()+]/g,'');
  if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return neg?-n:n}

function row(t){const c=cat(t.type,t.category),det=DB.settings.mode==='detailed';
  const meta=[esc(c.label)];
  if(t.status==='pending')meta.push('<span class="badge warn">pendente</span>');
  if(!counts(t))meta.push('<span class="badge">fora dos totais</span>');
  if(t.installment)meta.push(`<span class="badge">${t.installment.n}/${t.installment.total}</span>`);
  if(det){if(t.method)meta.push(esc(t.method));if(t.account)meta.push(esc(t.account));t.tags.forEach(x=>meta.push(`<span class="tag">#${esc(x)}</span>`));if(t.recurring)meta.push('<i class="ph-bold ph-repeat"></i>');if(t.by&&t.by!==me())meta.push(`<i class="ph-bold ph-user"></i>${esc(who(t.by))}`)}
  return `<button class="tx ${t.status==='pending'?'pend':''}" onclick="openDetail('${t.id}')"><span class="tx-ic" style="--c:${c.color}"><i class="ph-bold ${c.icon}"></i></span><span class="tx-main"><span class="tx-desc">${esc(t.desc||c.label)}</span><span class="tx-meta">${meta.join(' · ')}</span></span><span class="tx-val mono ${t.type}">${TYPES[t.type].sign} ${money(t.value)}</span></button>`}

   <div class="search"><i class="ph-bold ph-magnifying-glass"></i><input class="inp" id="qInp" placeholder="Buscar descrição, tag, valor…" value="${esc(S.f.q)}" oninput="S.f.q=this.value;S.f.limit=200;rListBody()"></div>
   <div class="chips">${[['all','Todos'],['out','Saídas'],['in','Entradas'],['save','Cofre'],['pending','Pendentes']].map(([k,l])=>`<button class="chip ${S.f.type===k?'on':''}" onclick="setF('type','${k}')">${l}</button>`).join('')}

   <div id="listBody"></div>`;
  rListBody()}
function rListBody(){const L=listFiltered();
  if(!L.length){$('#listBody').innerHTML=`<div class="card empty"><i class="ph-duotone ph-magnifying-glass"></i>Nada encontrado com esses filtros.</div>`;return}

  $('#listBody').innerHTML=`<div class="sub" style="margin:2px 4px 6px">${L.length} lançamento${L.length>1?'s':''} · <span style="color:var(--in)">+${money(tin)}</span> · <span style="color:var(--out)">−${money(tout)}</span>${tsv?` · <span style="color:var(--sv)">cofre ${money(tsv)}</span>`:''} <span>(inclui pendentes)</span></div>
   <div class="card" style="padding:4px 10px 10px">${Object.keys(groups).map(dk=>{const g=groups[dk],net=g.reduce((a,t)=>a+(!counts(t)?0:t.type==='in'?t.value:t.type==='out'?-t.value:0),0);return `<div class="day"><span>${fmtDay(dk)}</span><span class="mono">${net?(net>0?'+':'')+money(net):''}</span></div>${g.map(row).join('')}`}).join('')}
   ${L.length>S.f.limit?`<button class="btn block" style="margin-top:10px" onclick="S.f.limit+=200;rListBody()">Mostrar mais (${L.length-S.f.limit} restantes)</button>`:''}</div>`}

const kv=(k,v,raw)=>`<div class="kv-r"><span>${k}</span><b>${raw?v:esc(v)}</b></div>`;
function openDetail(id){const t=find(id);if(!t)return;const c=cat(t.type,t.category);
  const later=t.groupId?alive().filter(x=>x.groupId===t.groupId&&x.date>t.date).length:0;
  openSheet(`<div class="det-head"><span class="tx-ic lg" style="--c:${c.color}"><i class="ph-bold ${c.icon}"></i></span><div style="min-width:0"><div class="det-val mono" style="color:${TYPES[t.type].color}">${TYPES[t.type].sign} ${money(t.value)}</div><div class="det-desc">${esc(t.desc||c.label)}</div></div></div>
  <div class="kv">${kv('Tipo',TYPES[t.type].label)}${kv('Categoria',c.label)}${kv('Data',new Date(t.date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}))}${kv('Status',t.status==='paid'?'✓ Pago / recebido':'⏳ Pendente')}${t.method?kv('Forma',t.method):''}${t.account?kv('Conta / cartão',t.account):''}${t.installment?kv('Parcela',t.installment.n+' de '+t.installment.total):''}${t.recurring?kv('Recorrência','Mensal'):''}${t.tags.length?kv('Tags',t.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join(' '),1):''}${t.notes?kv('Notas',esc(t.notes).replace(/\n/g,'<br>'),1):''}${!counts(t)?kv('Totais','Fora dos totais'):''}${t.by?kv('Última alteração por',t.by):''}${kv('Criado em',fmtStamp(t.createdAt))}${t.updatedAt!==t.createdAt?kv('Editado em',fmtStamp(t.updatedAt)):''}</div>
  <div class="actions">${t.status==='pending'?`<button class="btn pri full" onclick="markPaid('${t.id}')"><i class="ph-bold ph-check"></i>Marcar como ${t.type==='in'?'recebido':'pago'}</button>`:''}
   <button class="btn" onclick="openForm('${t.id}')"><i class="ph-bold ph-pencil-simple"></i>Editar</button><button class="btn" onclick="dupTx('${t.id}')"><i class="ph-bold ph-copy"></i>Duplicar</button>
   <button class="btn danger ${later?'':'full'}" onclick="delTx('${t.id}')"><i class="ph-bold ph-trash"></i>Excluir</button>${later?`<button class="btn danger" onclick="delTx('${t.id}',1)">Excluir + ${later} seguintes</button>`:''}</div>`)}
function touch(t){t.updatedAt=now();t.by=me()}
function markPaid(id){const t=find(id);t.status='paid';touch(t);save();closeSheet();render();toast('Marcado como '+(t.type==='in'?'recebido':'pago'))}
function delTx(id,group){const t=find(id);const L=group?alive().filter(x=>x.groupId===t.groupId&&x.date>=t.date):[t];
  L.forEach(x=>{x.deleted=true;touch(x)});save();closeSheet();render();
  toast(L.length>1?`${L.length} lançamentos excluídos`:'Lançamento excluído',{label:'Desfazer',fn:()=>{L.forEach(x=>{x.deleted=false;touch(x)});save();render()}})}
function dupTx(id){openForm(null,{from:find(id)})}

function openForm(id,preset){if(!DB)return;const t=id?find(id):null,src=t||preset?.from||null;
  S.form={id:t?.id||null,type:src?.type||preset?.type||(S.f.type==='in'&&S.page==='list'?'in':'out'),cat:src?.category||null};
  const det=DB.settings.mode==='detailed'||(src&&(src.notes||src.tags.length||src.account||src.method||src.status==='pending'));
  const defDate=t?t.date:(S.ym===today().slice(0,7)||preset?.from?today():S.ym+'-01');
  const sib=t&&t.groupId?alive().filter(x=>x.groupId===t.groupId&&x.date>t.date).length:0;
  const descs=[...new Set(alive().sort(byDate).slice(0,300).map(x=>x.desc).filter(Boolean))].slice(0,80);
  openSheet(`<div class="sheet-t">${t?'Editar lançamento':preset?.from?'Duplicar lançamento':'Novo lançamento'}</div>
   <div class="seg" id="fType">${Object.entries(TYPES).map(([k,v])=>`<button data-t="${k}" onclick="fSetType('${k}')">${v.label}</button>`).join('')}</div>
   <label class="valbox"><span>R$</span><input id="fVal" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${src?src.value.toFixed(2).replace('.',','):''}" onkeydown="if(event.key==='Enter')submitTx()"></label>
   <input id="fDesc" class="inp" placeholder="Descrição (ex: Mercado, Cliente Ana)" list="descList" value="${esc(src?.desc||'')}" oninput="fSuggest()" autocomplete="off" style="margin-bottom:14px">
   <datalist id="descList">${descs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
   <div class="lbl2">Categoria</div><div class="catgrid" id="fCats"></div>
   <div class="row2"><input type="date" id="fDate" class="inp" value="${defDate}"><div class="quick"><button onclick="$('#fDate').value=today()">Hoje</button><button onclick="$('#fDate').value=iso(new Date(Date.now()-864e5))">Ontem</button></div></div>
   <details ${det?'open':''}><summary>Mais detalhes</summary>
    <div class="row2"><label class="field">Status<select id="fStatus" class="inp"><option value="paid">Pago / recebido</option><option value="pending" ${src?.status==='pending'?'selected':''}>Pendente / agendado</option></select></label>
     <label class="field">Forma<select id="fMethod" class="inp"><option value="">—</option>${METHODS.map(x=>`<option ${src?.method===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
    <label class="field">Conta ou cartão<input id="fAcc" class="inp" placeholder="Ex: Inter, Nubank" value="${esc(src?.account||'')}"></label>
    <label class="field">Tags (separe por vírgula)<input id="fTags" class="inp" placeholder="viagem, casamento-joao" value="${esc(src?.tags.join(', ')||'')}"></label>
    <label class="field">Notas<textarea id="fNotes" class="inp" rows="2" placeholder="Detalhes, nº do pedido, pra quem foi…">${esc(src?.notes||'')}</textarea></label>
    ${t?'':`<div class="row2"><label class="field">Parcelas<input id="fParc" class="inp" type="number" min="1" max="48" value="1" inputmode="numeric"></label><label class="field">Repetir por (meses)<input id="fRep" class="inp" type="number" min="1" max="36" value="1" inputmode="numeric"></label></div>
    <label class="chk"><input type="checkbox" id="fParcTotal" checked>Valor digitado é o total (divide entre as parcelas)</label>
    <p class="sub">Use parcelas <b>ou</b> repetição. As seguintes entram como pendentes.</p>`}
   </details>
   ${sib?`<label class="chk"><input type="checkbox" id="fApplyNext">Aplicar também às ${sib} seguintes da série (valor, descrição, categoria e detalhes)</label>`:''}
   <button class="btn pri block" onclick="submitTx()"><i class="ph-bold ph-check"></i>Salvar</button>`);
  fSetType(S.form.type,true);if(!t)setTimeout(()=>$('#fVal')?.focus(),260)}
function fSetType(k,keep){S.form.type=k;document.querySelectorAll('#fType button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  if(!keep||!cats(k).some(c=>c.id===S.form.cat))S.form.cat=cats(k)[0].id;fCats()}
function fCats(){$('#fCats').innerHTML=cats(S.form.type).map(c=>`<button class="cat ${S.form.cat===c.id?'on':''}" style="--c:${c.color}" onclick="S.form.cat='${c.id}';fCats()"><i class="ph-bold ${c.icon}"></i>${c.label}</button>`).join('')}
function fSuggest(){if(S.form.id)return;const d=$('#fDesc').value.trim().toLowerCase();if(!d)return;const h=alive().sort(byDate).find(x=>x.desc.toLowerCase()===d);if(h){S.form.type=h.type;S.form.cat=h.category;fSetType(h.type,true)}}
function submitTx(){
  const v=parseMoney($('#fVal').value);if(!(v>0)){toast('Informe um valor maior que zero');$('#fVal').focus();return}
  const date=$('#fDate').value;if(!date){toast('Informe a data');return}
  const g=s=>($(s)?.value??'').trim();
  const n=Math.min(48,Math.max(1,parseInt(g('#fParc'))||1)),rep=Math.min(36,Math.max(1,parseInt(g('#fRep'))||1));
  if(n>1&&rep>1){toast('Use parcelas OU repetição, não os dois');return}
  const base={type:S.form.type,value:r2(v),date,category:S.form.cat,desc:g('#fDesc'),status:g('#fStatus')||'paid',method:g('#fMethod'),account:g('#fAcc'),tags:g('#fTags').split(/[,#]/).map(x=>x.trim()).filter(Boolean),notes:g('#fNotes'),by:me()};
  const L=DB.profiles[P()],editing=!!S.form.id;
  if(editing){const t=find(S.form.id),oldDate=t.date;Object.assign(t,base);touch(t);
    if($('#fApplyNext')?.checked){const {date:_d,status:_s,...rest}=base;alive().filter(x=>x.groupId===t.groupId&&x.id!==t.id&&x.date>oldDate).forEach(x=>{Object.assign(x,rest);touch(x)})}}
  else{const gid=n>1||rep>1?uid():null;
    if(n>1){const tot=$('#fParcTotal')?.checked,pv=tot?Math.floor(v/n*100)/100:r2(v);
      for(let i=0;i<n;i++)L.push(norm({...base,value:tot&&i===n-1?r2(v-pv*(n-1)):pv,date:addMonths(date,i),installment:{n:i+1,total:n},groupId:gid,status:i?'pending':base.status}))}
    else for(let i=0;i<rep;i++)L.push(norm({...base,date:addMonths(date,i),recurring:rep>1,groupId:gid,status:i?'pending':base.status}))}
  save();closeSheet();S.ym=date.slice(0,7);render();toast(editing?'Alterações salvas':'Lançamento salvo')}

// ───────── ANÁLISE ─────────
function setAn(k,v){S.an[k]=v;rAnalysis()}
function periodTx(p,ym=S.ym){const all=alive();if(p==='month')return all.filter(t=>t.date.startsWith(ym));if(p==='3m'){const f=shiftYm(ym,-2);return all.filter(t=>{const k=t.date.slice(0,7);return k>=f&&k<=ym})}if(p==='year')return all.filter(t=>t.date.startsWith(ym.slice(0,4)));return all}
function rAnalysis(){
  const {type,period}=S.an,L=periodTx(period).filter(t=>t.type===type&&counts(t)),tot=L.reduce((s,t)=>s+t.value,0);
  const prev=period==='month'?periodTx('month',shiftYm(S.ym,-1)).filter(t=>t.type===type&&counts(t)):[];
  const map={},pmap={};L.forEach(t=>map[t.category]=(map[t.category]||0)+t.value);prev.forEach(t=>pmap[t.category]=(pmap[t.category]||0)+t.value);
  const ids=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  $('#p-analysis').innerHTML=`${period==='all'?'<h2 class="pt">Análise</h2>':monthBar()}
   <div class="seg">${[['month','Mês'],['3m','3 meses'],['year','Ano'],['all','Tudo']].map(([k,l])=>`<button class="${period===k?'on':''}" onclick="setAn('period','${k}')">${l}</button>`).join('')}</div>
   <div class="chips">${[['out','Saídas'],['in','Entradas'],['save','Aportes no cofre']].map(([k,l])=>`<button class="chip ${type===k?'on':''}" onclick="setAn('type','${k}')">${l}</button>`).join('')}</div>
   ${!L.length?'<div class="card empty"><i class="ph-duotone ph-chart-pie-slice"></i>Sem dados neste período.</div>':`
   <div class="cols"><div class="card"><div style="color:var(--tx2);font-size:13px;font-weight:700">Total no período <span class="sub">(inclui pendentes${type==='save'?', sem descontar resgates':''})</span></div><div class="big mono">${money(tot)}</div><div class="sub">${L.length} lançamentos · média ${money(tot/L.length)}</div>
    <div class="chartbox" style="margin-top:12px"><canvas id="cCat"></canvas></div></div>
   <div class="card"><div class="card-t" style="margin-bottom:6px">Por categoria</div>${ids.map(id=>{const c=cat(type,id),v=map[id],pv=pmap[id]||0,dl=period==='month'&&pv?(v-pv)/pv*100:null;
     return `<button class="rank" onclick="S.f={q:'',type:'${type}',cat:'${id}',scope:'${period==='month'?'month':'all'}',limit:200};go('list')"><span class="tx-ic" style="--c:${c.color}"><i class="ph-bold ${c.icon}"></i></span><span class="tx-main"><span style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(c.label)}</b><b class="mono" style="font-size:14px">${money(v)}</b></span><span class="bar" style="--c:${c.color}"><i style="width:${(v/tot*100).toFixed(1)}%"></i></span><span class="tx-meta">${(v/tot*100).toFixed(1)}%${dl!==null?` · <span class="delta ${type==='out'?(dl>0?'up':'down'):''}">${dl>0?'▲':'▼'} ${Math.abs(dl).toFixed(0)}% vs mês ant.</span>`:''}</span></span></button>`}).join('')}</div></div>
   <div class="cols"><div class="card"><div class="card-t" style="margin-bottom:12px"><i class="ph-bold ph-chart-line-up"></i>Evolução das principais (6 meses)</div><div class="chartbox"><canvas id="cEvo"></canvas></div></div>
   <div class="card"><div class="card-t" style="margin-bottom:6px"><i class="ph-bold ph-sort-descending"></i>Maiores lançamentos</div>${[...L].sort((a,b)=>b.value-a.value).slice(0,6).map(row).join('')}</div></div>`}`;
  if(!L.length)return;
  mk('cCat',{type:'doughnut',data:{labels:ids.map(i=>cat(type,i).label),datasets:[{data:ids.map(i=>map[i]),backgroundColor:ids.map(i=>cat(type,i).color),borderColor:cv('--s1'),borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)}`}}}}});
  const months=[];for(let i=5;i>=0;i--)months.push(shiftYm(S.ym,-i));
  mk('cEvo',{type:'line',data:{labels:months.map(m=>MONTHS[+m.slice(5)-1].slice(0,3)),datasets:ids.slice(0,5).map(id=>{const c=cat(type,id);return{label:c.label,data:months.map(m=>monthTx(m).filter(t=>t.type===type&&t.category===id&&counts(t)).reduce((s,t)=>s+t.value,0)),borderColor:c.color,backgroundColor:c.color,tension:.35,borderWidth:2.5,pointRadius:3}})},options:baseOpts()});
}

// ───────── METAS ─────────
function budgetRows(){const b=DB.budgets[P()]||{},L=monthTx(S.ym).filter(t=>t.type==='out'&&counts(t));return cats('out').filter(c=>counts({category:c.id})).map(c=>{const spent=L.filter(t=>t.category===c.id).reduce((s,t)=>s+t.value,0),limit=+b[c.id]||0;return{c,spent,limit,pct:limit?spent/limit*100:0}})}
function budRow(b){const col=b.pct>=100?'var(--out)':b.pct>=80?'var(--warn)':'var(--in)';return `<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600"><span>${esc(b.c.label)}</span><span class="mono">${money(b.spent)} <span style="color:var(--tx3)">/ ${money(b.limit)}</span></span></div><div class="bar" style="--c:${col}"><i style="width:${Math.min(100,b.pct)}%"></i></div><div class="tx-meta">${b.pct>=100?`Estourou em ${money(b.spent-b.limit)}`:`Restam ${money(b.limit-b.spent)} · ${b.pct.toFixed(0)}%`}</div></div>`}
function setBudget(id,v){const n=parseMoney(v);const B=DB.budgets[P()]=DB.budgets[P()]||{};if(n>0)B[id]=r2(n);else delete B[id];DB.bUpd[P()]=now();save();rBudgets()}
function rBudgets(){const R=budgetRows(),lim=R.reduce((s,b)=>s+b.limit,0),sp=R.filter(b=>b.limit).reduce((s,b)=>s+b.spent,0),priv=DB.settings.privacy;
  $('#p-budgets').innerHTML=`${monthBar()}<h2 class="pt">Metas de gasto</h2>
   ${lim?`<div class="card">${budRow({c:{label:'Total com meta'},spent:sp,limit:lim,pct:sp/lim*100})}</div>`:'<p class="muted">Defina um limite mensal por categoria. A barra fica amarela em 80% e vermelha em 100%. Pendentes do mês contam como compromisso.</p>'}
   ${priv?'<p class="muted"><i class="ph-bold ph-eye-slash"></i> Desative o modo privacidade para editar as metas.</p>':''}
   <div class="card">${R.map(b=>`<div style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)"><span class="tx-ic" style="--c:${b.c.color}"><i class="ph-bold ${b.c.icon}"></i></span><div class="tx-main"><b style="font-size:14px">${b.c.label}</b><span class="tx-meta mono">gasto ${money(b.spent)}</span>${b.limit?`<div class="bar" style="--c:${b.pct>=100?'var(--out)':b.pct>=80?'var(--warn)':'var(--in)'}"><i style="width:${Math.min(100,b.pct)}%"></i></div>`:''}</div><input class="inp mono" style="width:120px;text-align:right" inputmode="decimal" ${priv?`disabled placeholder="${b.limit?'••••':'Sem meta'}"`:`placeholder="Sem meta" value="${b.limit?b.limit.toFixed(2).replace('.',','):''}"`} onchange="setBudget('${b.c.id}',this.value)"></div>`).join('')}</div>`}

// ───────── IMPORTAÇÃO ─────────
function detectSep(lines){const s=lines.slice(0,15).join('\n'),c=ch=>(s.split(ch).length-1);const a=c(';'),b=c(','),t=c('\t');return a>=b&&a>=t?';':t>=b?'\t':','}
function splitCSV(line,sep){const r=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q;continue}if(ch===sep&&!q){r.push(cur);cur='';continue}cur+=ch}r.push(cur);return r.map(x=>x.trim())}
function parseDate(s){s=(s||'').trim();let m=s.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];if(+m[2]>=1&&+m[2]<=12)return `${y}-${m[2]}-${m[1]}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;return null}
const ownNames=()=>(DB.settings.ownNames||'').split(',').map(s=>s.trim().toLowerCase()).filter(s=>s.length>3);
function applyOwn(){const own=ownNames();if(!own.length)return toast('Preencha seus nomes primeiro');let n=0;
  alive().forEach(t=>{if((t.type==='in'||t.type==='out')&&own.some(x=>t.desc.toLowerCase().includes(x))&&t.category!=='transf'&&t.category!=='transf_in'){t.category=t.type==='in'?'transf_in':'transf';touch(t);n++}});
  save();render();toast(n+' lançamento(s) marcados como transferência própria')}
function autoCateg(desc,val){const d=(desc||'').toLowerCase(),dn=pr=>P()==='danfer'?pr[1]:pr[0];
  const h=histMap().get(d+'|'+(val>0));if(h)return{type:h.type,category:h.category};
  if(ownNames().some(n=>d.includes(n)))return{type:val>0?'in':'out',category:val>0?'transf_in':'transf'};
  const sv=dn(['guardado','caixa']);
  if(/resgat|dinheiro retirado|retirada.*(cofr|caixinha)/.test(d))return{type:'withdraw',category:sv};
  if(/cofrinho|caixinha|aplica[cç][aã]o|dinheiro reservado|guardad/.test(d))return{type:'save',category:sv};
  if(val>0){if(/sal[aá]rio|folha|proventos/.test(d))return{type:'in',category:dn(['salario','servicos'])};if(/rendimento|juros|dividendo/.test(d))return{type:'in',category:'rendimentos'};if(/estorno|reembolso/.test(d))return{type:'in',category:dn(['reembolso','outros_in'])};return{type:'in',category:dn(['outros_in','servicos'])}}
  const rules=[[/uber|99 ?(app|tec|pop)|t[aá]xi|gasolina|combust|posto |estacion|ped[aá]gio/,['transporte','deslocamento']],[/supermerc|mercado(?! ?livre)|atacad|giassi|bistek|assa[ií]/,['mercado','operacional']],[/ifood|rappi|restaurante|lanch|padaria|pizz|burger|caf[eé]|alimentos/,['alimentacao','operacional']],[/netflix|spotify|youtube|disney|hbo|prime video|apple|icloud|google one|chatgpt|openai|adobe|canva/,['assinaturas','software']],[/amazon|shopee|mercado ?livre|magalu|magazine|americanas|shein|aliexpress/,['compras','fornecedores']],[/farm[aá]cia|droga|raia|panvel|cl[ií]nica|hospital|m[eé]dic|odonto|laborat/,['saude','operacional']],[/aluguel|condom[ií]nio|iptu/,['moradia','operacional']],[/energia|celesc|enel|sabesp|casan|internet|\b(vivo|claro|tim|oi)\b/,['contas','operacional']],[/fatura|pagamento.*cart[aã]o/,['cartao','operacional']],[/escola|curso|faculdade|udemy|alura|hotmart/,['educacao','operacional']],[/darf|\bdas\b|simples nacional|inss|fgts|imposto|receita federal|minist[eé]rio da fazenda/,['outros','impostos']]];
  for(const [re,pr] of rules)if(re.test(d))return{type:'out',category:dn(pr)};
  return{type:'out',category:dn(['outros','operacional'])}}
function parseStatement(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()),sep=detectSep(lines),out=[];
  const push=(date,desc,val)=>{if(!date||!isFinite(val)||val===0)return;const {type,category}=autoCateg(desc,val);out.push({date,desc:(desc||'Importado').replace(/\s+/g,' ').trim(),value:r2(Math.abs(val)),type,category})};
  let h=lines.findIndex(l=>/RELEASE_DATE|DATA_LANCAMENTO/i.test(l));
  if(h>=0){lines.slice(h+1).forEach(l=>{const c=splitCSV(l,sep);if(c.length>=4)push(parseDate(c[0]),c[1],parseMoney(c[3]))});if(out.length)return out}
  h=lines.findIndex(l=>/^date,title,amount/i.test(l.trim()));
  if(h>=0){lines.slice(h+1).forEach(l=>{const c=splitCSV(l,',');if(c.length>=3)push(parseDate(c[0]),c[1],-parseMoney(c[2]))});return out}
  h=lines.findIndex(l=>/data|date/i.test(l)&&/(valor|amount|quantia|cr[eé]dito|d[eé]bito)/i.test(l));
  if(h>=0){const H=splitCSV(lines[h],sep).map(x=>x.toLowerCase()),f=re=>H.findIndex(x=>re.test(x));
    const iD=f(/^data|^date/);
    const iT=[/descri/,/hist[oó]rico/,/title|estabelecimento|memo/,/lan[cç]amento/].map(re=>H.findIndex((x,i)=>i!==iD&&re.test(x))).find(i=>i>=0)??-1;
    const iV=f(/^valor|amount|quantia/),iC=f(/cr[eé]dito/),iB=f(/d[eé]bito/);
    if(iD>=0&&(iV>=0||iC>=0||iB>=0)){lines.slice(h+1).forEach(l=>{const c=splitCSV(l,sep);const v=iV>=0?parseMoney(c[iV]):(parseMoney(c[iC])||0)-Math.abs(parseMoney(c[iB])||0);push(parseDate(c[iD]),iT>=0?c[iT]||'':'',v)});if(out.length)return out}}
  const dre=/(\d{2}[\/\-.]\d{2}[\/\-.]\d{2,4}|\d{4}-\d{2}-\d{2})/,isMoney=x=>/\d[.,]\d{2}\)?$/.test(x)&&/^[\s\-+()R$\d.,]+$/.test(x)&&!dre.test(x);
  lines.forEach(l=>{if(/^\W*(saldo|total)\b/i.test(l))return;const m=l.match(dre);if(!m)return;const c=splitCSV(l,sep),mon=c.filter(isMoney);if(!mon.length)return;
    const desc=c.filter(x=>!isMoney(x)&&!dre.test(x)&&/[a-zà-ú]/i.test(x)).sort((a,b)=>b.length-a.length)[0]||'';push(parseDate(m[1]),desc,parseMoney(mon[0]))});
  return out}
function impFile(file){if(!file)return;const rd=enc=>new Promise(r=>{const f=new FileReader();f.onload=e=>r(e.target.result);f.readAsText(file,enc)});
  rd('UTF-8').then(t=>t.includes('\uFFFD')?rd('ISO-8859-1'):t).then(impRead)}
function impRead(text){if(!text||!text.trim())return toast('Nada para ler');_hist=null;const rows=parseStatement(text);if(!rows.length)return toast('Não encontrei lançamentos nesse formato');
  const keys=new Set(alive().map(t=>t.date+'|'+t.value.toFixed(2)+'|'+t.desc.trim().toLowerCase()));
  S.imp=rows.map(r=>{const dup=keys.has(r.date+'|'+r.value.toFixed(2)+'|'+r.desc.toLowerCase());return{...r,dup,sel:!dup}});rImport()}
function impCat(i,v){const [t,c]=v.split('|');S.imp[i].type=t;S.imp[i].category=c}
function impCommit(){const sel=S.imp.filter(r=>r.sel);if(!sel.length)return;sel.forEach(r=>DB.profiles[P()].push(norm({...r,status:'paid',tags:['importado'],by:me()})));save();S.ym=sel.map(r=>r.date).sort().pop().slice(0,7);S.imp=[];toast(`${sel.length} lançamentos importados`);filterGo('all')}
function rImport(){const n=S.imp.filter(r=>r.sel).length,dups=S.imp.filter(r=>r.dup).length,all=S.imp.length&&n===S.imp.length;
  const opts=r=>Object.keys(TYPES).map(tp=>`<optgroup label="${TYPES[tp].label}">${cats(tp).map(c=>`<option value="${tp}|${c.id}" ${r.type===tp&&r.category===c.id?'selected':''}>${c.label}</option>`).join('')}</optgroup>`).join('');
  $('#p-import').innerHTML=`<h2 class="pt">Importar extrato</h2>
   <div class="card"><p class="muted">Destino: <b>${pname()}</b>. Lê CSV/TXT do Inter, Nubank (conta e cartão), Itaú, Bradesco, BB, Caixa e formatos com colunas de data e valor. Você confere tudo antes de importar.</p>
    <label class="drop" id="dropZ"><input type="file" accept=".csv,.txt" hidden onchange="impFile(this.files[0])"><i class="ph-duotone ph-upload-simple"></i><b>Escolher arquivo</b><span>ou arraste aqui</span></label>
    <textarea id="impText" class="inp" rows="3" placeholder="…ou cole as linhas do extrato"></textarea>
    <button class="btn block" style="margin-top:8px" onclick="impRead($('#impText').value)">Ler texto colado</button></div>
   ${S.imp.length?`<div class="card"><div class="card-h"><div class="card-t">Prévia · ${S.imp.length} linhas</div><button class="link" onclick="S.imp.forEach(r=>r.sel=${!all});rImport()">${all?'Desmarcar':'Marcar'} todos</button></div>
    ${dups?`<p class="muted warn"><i class="ph-bold ph-warning"></i> ${dups} parecem já existir e foram desmarcados.</p>`:''}
    ${S.imp.map((r,i)=>`<div class="imp-r ${r.sel?'':'off'}"><input type="checkbox" ${r.sel?'checked':''} onchange="S.imp[${i}].sel=this.checked;rImport()"><div class="tx-main"><span class="tx-desc">${esc(r.desc)}</span><span class="tx-meta">${fmtShort(r.date)}${r.dup?' <span class="badge warn">duplicado?</span>':''}</span><select class="mini-sel" onchange="impCat(${i},this.value);rImport()">${opts(r)}</select></div><span class="tx-val mono ${r.type}">${TYPES[r.type].sign} ${money(r.value)}</span></div>`).join('')}
    <div class="actions" style="margin-top:12px"><button class="btn" onclick="S.imp=[];rImport()">Descartar</button><button class="btn pri" onclick="impCommit()" ${n?'':'disabled'}>Importar ${n}</button></div></div>`:''}`;
  const z=$('#dropZ');z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');impFile(e.dataTransfer.files[0])}}

// ───────── LOGIN + NUVEM ─────────
const CONFIGURED=!/SEU-PROJETO|COLE_A_NOVA/.test(SUPABASE_URL+SUPABASE_KEY);
const sbc=CONFIGURED&&window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let sbSession=null,syncing=false,syncAgain=false,currentUser=null;
const gMsg=(m,err)=>{const e=$('#gMsg');e.textContent=m;e.style.color=err?'var(--out)':'var(--tx2)'};
function showGate(){currentUser=null;DB=null;KEY='';closeSheet();$('#gate').classList.remove('off','loading');document.documentElement.dataset.profile='pessoal'}
function showApp(){const u=sbSession.user;if(currentUser===u.id)return;currentUser=u.id;
  DB=loadDB(u.id);persist();$('#gate').classList.add('off');$('#gPass').value='';gMsg('');go('home');syncNow(true)}
async function doLogin(e){e.preventDefault();if(!sbc)return;const b=$('#gBtn');b.disabled=true;gMsg('Entrando…');
  const {error}=await sbc.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value});
  b.disabled=false;if(error)gMsg(/invalid login/i.test(error.message)?'E-mail ou senha incorretos.':error.message,true)}
async function forgot(){const email=$('#gEmail').value.trim();if(!/\S+@\S+\.\S+/.test(email))return gMsg('Digite seu e-mail acima primeiro.',true);
  const {error}=await sbc.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  gMsg(error?error.message:'Se o e-mail estiver cadastrado, você vai receber um link para criar nova senha.',!!error)}
function askNewPassword(recovery){openSheet(`<div class="sheet-t">${recovery?'Crie uma nova senha':'Alterar senha'}</div>
  <label class="field">Nova senha (mín. 8 caracteres)<input id="np1" class="inp" type="password" autocomplete="new-password"></label>
  <label class="field">Repita a nova senha<input id="np2" class="inp" type="password" autocomplete="new-password"></label>
  <button class="btn pri block" onclick="saveNewPassword()">Salvar senha</button>`)}
async function saveNewPassword(){const a=$('#np1').value,b=$('#np2').value;if(a.length<8)return toast('Use pelo menos 8 caracteres');if(a!==b)return toast('As senhas não conferem');
  const {error}=await sbc.auth.updateUser({password:a});if(error)return toast('Erro: '+error.message);closeSheet();toast('Senha alterada')}
async function logout(){if(!await ask('Sair da conta?','Os dados ficam salvos na nuvem e são removidos deste aparelho.','Sair'))return;
  await syncNow(true);const k=KEY;await sbc.auth.signOut();if(k)localStorage.removeItem(k);['acefer_v2','acefer_txs','danfer_txs'].forEach(x=>localStorage.removeItem(x))}
function setSync(st){const m={off:['ph-cloud-slash','var(--tx3)'],idle:['ph-cloud','var(--tx2)'],busy:['ph-arrows-clockwise spin','var(--warn)'],ok:['ph-cloud-check','var(--in)'],err:['ph-cloud-warning','var(--out)']}[st];$('#syncBtn').innerHTML=`<i class="ph-bold ${m[0]}" style="color:${m[1]}"></i>`}
async function fetchAll(){const all=[];for(let from=0;;from+=1000){const {data,error}=await sbc.from('acefer_tx').select('id,profile,data').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}return all}
async function syncNow(silent){if(!sbc||!sbSession||!DB)return;
  if(syncing){syncAgain=true;return}if(!navigator.onLine){setSync('off');if(!silent)toast('Sem internet. Os dados sobem quando voltar.');return}
  syncing=true;setSync('busy');
  try{const data=await fetchAll();
    if(!DB)return;
    const remote=new Map(data.map(r=>[r.id,r])),up=[];
    for(const p of ['pessoal','danfer']){const map=new Map(DB.profiles[p].map(t=>[t.id,t]));
      data.filter(r=>r.profile===p).forEach(r=>{const rt=norm(r.data),l=map.get(rt.id);if(!l||rt.updatedAt>l.updatedAt)map.set(rt.id,rt)});
      map.forEach(t=>{const r=remote.get(t.id);if(!r||t.updatedAt>(r.data?.updatedAt||''))up.push({id:t.id,profile:p,data:t,updated_at:t.updatedAt})});
      DB.profiles[p]=[...map.values()];
      const bid='budgets:'+p,br=remote.get(bid),lu=DB.bUpd[p]||'',ru=br?.data?.updatedAt||'';
      if(br&&ru>lu){DB.budgets[p]=br.data.budgets||{};DB.bUpd[p]=ru}
      else if(lu&&lu>ru)up.push({id:bid,profile:'_budgets',data:{budgets:DB.budgets[p],updatedAt:lu},updated_at:lu})}
    for(let i=0;i<up.length;i+=200){const {error:e}=await sbc.from('acefer_tx').upsert(up.slice(i,i+200));if(e)throw e}
    _hist=null;DB.lastSync=now();persist();setSync('ok');
    if(!$('#sheet').classList.contains('on')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))render();
    if(!silent)toast(`Sincronizado · ${up.length} enviado(s)`)}
  catch(e){setSync('err');if(!silent)toast(/row-level security/i.test(e.message)?'Seu e-mail não está autorizado. Veja a lista acefer_members no Supabase.':'Erro ao sincronizar: '+e.message)}
  finally{syncing=false;if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(true),500)}}}

// ───────── AJUSTES / MAIS ─────────
function rSettings(){const st=DB.settings;
  $('#p-settings').innerHTML=`<h2 class="pt">Mais</h2>
   <div class="card mob-only" style="padding:4px 16px"><button class="menu-l" onclick="go('budgets')"><i class="ph-bold ph-target"></i>Metas de gasto<i class="ph-bold ph-caret-right"></i></button><button class="menu-l" onclick="go('import')"><i class="ph-bold ph-file-arrow-down"></i>Importar extrato<i class="ph-bold ph-caret-right"></i></button></div>
   <div class="card"><div class="card-t" style="margin-bottom:6px"><i class="ph-bold ph-user-circle"></i>Conta</div>
    <p class="muted">Conectado como <b>${esc(me())}</b>${DB.lastSync?'<br>Última sincronização: '+fmtStamp(DB.lastSync):''}</p>
    <div class="actions"><button class="btn pri full" onclick="syncNow()"><i class="ph-bold ph-arrows-clockwise"></i>Sincronizar agora</button><button class="btn" onclick="askNewPassword()"><i class="ph-bold ph-key"></i>Alterar senha</button><button class="btn danger" onclick="logout()"><i class="ph-bold ph-sign-out"></i>Sair</button></div></div>
   <div class="card"><div class="card-t" style="margin-bottom:12px"><i class="ph-bold ph-sliders"></i>Preferências deste aparelho</div>
    <div class="lbl2">Perfil</div><div class="seg"><button class="${P()==='pessoal'?'on':''}" onclick="setProfile('pessoal')">Pessoal</button><button class="${P()==='danfer'?'on':''}" onclick="setProfile('danfer')">Danfer</button></div>
    <div class="lbl2">Modo</div><div class="seg"><button class="${st.mode==='simple'?'on':''}" onclick="setMode('simple')">Simples</button><button class="${st.mode==='detailed'?'on':''}" onclick="setMode('detailed')">Detalhado</button></div>
    <div class="lbl2">Tema</div><div class="seg">${[['dark','Escuro'],['light','Claro'],['emerald','Esmeralda']].map(([k,l])=>`<button class="${st.theme===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="lbl2">Fatura do cartão</div><div class="seg"><button class="${!st.excludeCard?'on':''}" onclick="setOpt('excludeCard',false)">Conta como gasto</button><button class="${st.excludeCard?'on':''}" onclick="setOpt('excludeCard',true)">Não conta</button></div>
    <p class="sub">Use "Não conta" se vocês lançam cada compra do cartão. Assim o pagamento da fatura não duplica o gasto. Combine a mesma opção nos dois aparelhos.</p>
    <div class="lbl2" style="margin-top:14px">Transferências próprias</div>
    <label class="field">Seus nomes nos extratos (separe por vírgula)<input class="inp" placeholder="alex camara ferreira, nome da esposa" value="${esc(st.ownNames||'')}" onchange="setOpt('ownNames',this.value)"></label>
    <p class="sub" style="margin-bottom:10px">Pix entre contas suas não é gasto nem receita: fica fora dos totais. Use o nome completo para não pegar parentes.</p>
    <button class="btn block" onclick="applyOwn()"><i class="ph-bold ph-arrows-left-right"></i>Marcar transferências próprias já lançadas</button></div>
   <div class="card" style="padding:4px 16px">
    <button class="menu-l" onclick="exportJSON()"><i class="ph-bold ph-file-js"></i>Backup completo (JSON)<i class="ph-bold ph-caret-right"></i></button>
    <button class="menu-l" onclick="exportCSV()"><i class="ph-bold ph-file-csv"></i>Planilha (CSV para Excel)<i class="ph-bold ph-caret-right"></i></button>
    <label class="menu-l" style="cursor:pointer"><i class="ph-bold ph-upload-simple"></i>Restaurar backup<input type="file" accept=".json" hidden onchange="restoreFile(this.files[0])"><i class="ph-bold ph-caret-right"></i></label>
    <button class="menu-l" onclick="resetProfile()" style="color:var(--out)"><i class="ph-bold ph-trash" style="color:var(--out)"></i>Apagar dados do perfil ${pname()}</button></div>
   <p class="sub" style="text-align:center">Acefer Economy 3.1 · atalho <kbd style="background:var(--s2)">N</kbd> = novo lançamento</p>`}
function download(content,name,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const stamp=()=>today().replace(/-/g,'');
function exportJSON(){download(JSON.stringify({app:'acefer',v:3,profiles:DB.profiles,budgets:DB.budgets,exportedAt:now()},null,2),`acefer-backup-${stamp()}.json`,'application/json')}
function exportCSV(){const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;const rows=['Perfil;Data;Tipo;Categoria;Descrição;Valor;Status;Forma;Conta;Tags;Parcela;Notas;Por'];
  ['pessoal','danfer'].forEach(p=>DB.profiles[p].filter(t=>!t.deleted).sort(byDate).forEach(t=>{const c=(CATS[p][t.type==='withdraw'?'save':t.type].find(x=>x.id===t.category)||{label:t.category}).label;
    rows.push([p,fmtShort(t.date),TYPES[t.type].label,q(c),q(t.desc),(t.type==='out'||t.type==='save'?-t.value:t.value).toFixed(2).replace('.',','),t.status==='paid'?'Pago':'Pendente',q(t.method),q(t.account),q(t.tags.join(', ')),t.installment?t.installment.n+'/'+t.installment.total:'',q(t.notes),q(t.by)].join(';'))}));
  download('\uFEFF'+rows.join('\n'),`acefer-${stamp()}.csv`,'text/csv;charset=utf-8')}
function restoreFile(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);const src=d.profiles||{pessoal:d.acefer_txs||[],danfer:d.danfer_txs||[]};let n=0;
  ['pessoal','danfer'].forEach(p=>{const map=new Map(DB.profiles[p].map(t=>[t.id,t]));(src[p]||[]).map(norm).forEach(t=>{if(t.type==='save'&&/dinheiro retirado|resgat/i.test(t.desc))t.type='withdraw';const l=map.get(t.id);if(!l||t.updatedAt>l.updatedAt){map.set(t.id,t);n++}});DB.profiles[p]=[...map.values()];
    if(d.budgets&&d.budgets[p]){DB.budgets[p]={...d.budgets[p]};DB.bUpd[p]=now()}});
  save();render();toast(`${n} lançamentos restaurados`)}catch(err){toast('Arquivo inválido')}};r.readAsText(file)}
async function resetProfile(){if(!await ask('Apagar tudo?',`Todos os lançamentos do perfil ${pname()} serão excluídos para todos da família, inclusive na nuvem. Faça um backup antes.`,'Apagar tudo',true))return;
  DB.profiles[P()].forEach(t=>{if(!t.deleted){t.deleted=true;touch(t)}});save();render();toast('Dados do perfil apagados')}

// ───────── início ─────────
document.addEventListener('keydown',e=>{if(!DB)return;if(e.key==='Escape')closeSheet();if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#sheet').classList.contains('on')){e.preventDefault();openForm()}});
window.addEventListener('online',()=>syncNow(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(true)});
if(!sbc){$('#gate').classList.remove('loading');gMsg(CONFIGURED?'Não foi possível carregar o Supabase. Verifique a internet.':'Configure SUPABASE_URL e SUPABASE_KEY no código.',true);$('#gBtn').disabled=true}
else sbc.auth.onAuthStateChange((ev,s)=>{sbSession=s;
  if(!s){showGate();setSync('off');return}
  showApp();
  if(ev==='PASSWORD_RECOVERY')setTimeout(()=>askNewPassword(true),300)});
</script>
